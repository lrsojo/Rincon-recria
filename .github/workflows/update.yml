name: Actualizar datos del dashboard

on:
  schedule:
    - cron: '0 9 * * *'   # Todos los dias a las 9am UTC (6am Argentina)
  push:
    branches: [main]
  workflow_dispatch:       # Boton manual desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Actualizar datos
        run: python update_data.py

      - name: Commit y push si hay cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-actualizar datos dashboard'
          file_pattern: 'recria_live.html'
